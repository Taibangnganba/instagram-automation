name: Post reel

# Publishes the oldest waiting clip to Instagram through the official API.

on:
  schedule:
    - cron: "52 6 * * *"  # 12:22 IST
    - cron: "52 12 * * *" # 18:22 IST
    - cron: "52 15 * * *" # 21:22 IST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Rehearse without posting"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: post-reel
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -q -r requirements.txt

      - name: Pick the next clip
        id: next
        run: python scripts/post_reel.py pick

      - name: Fetch the clip
        if: steps.next.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ steps.next.outputs.asset }}
        run: gh release download clips -p "$ASSET" -D work

      - name: Post to Instagram
        id: post
        if: steps.next.outputs.run == 'true'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          REPO_IS_PUBLIC: ${{ !github.event.repository.private }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          ASSET: ${{ steps.next.outputs.asset }}
        run: python scripts/post_reel.py post "work/$ASSET"

      - name: Save progress
        if: always() && steps.next.outputs.run == 'true'
        env:
          ASSET: ${{ steps.next.outputs.asset }}
          OUTCOME: ${{ steps.post.outcome }}
        run: bash scripts/commit_state.sh "Post $ASSET - $OUTCOME"

      - name: Remove the posted clip from storage
        if: steps.post.outcome == 'success' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ steps.next.outputs.asset }}
        run: gh release delete-asset clips "$ASSET" -y || true
